<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f9" />
    <title>AtaDey — Atasözü ve Deyim Oyunu</title>
    <meta
      name="description"
      content="Atasözleri ve deyimleri anlamlarıyla eşleştirerek Türkçe bilgini test et. İki yön, iki oyun tipi, 12.000'den fazla madde."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Tema sıçramasını önle: React açılmadan önce kayıtlı seçimi uygula.
      try {
        var storedTheme = localStorage.getItem("atadey.theme");
        if (storedTheme === "dark" || storedTheme === "light") {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
