    <script>
      // Tema sıçramasını önle: React açılmadan önce kayıtlı seçimi uygula.
      try {
        var storedTheme = localStorage.getItem("atadey.theme");
        if (storedTheme === "dark" || storedTheme === "light") {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (error) {}
    </script>

    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        AtaDey tarayıcıda çalışan bir oyun; JavaScript kapalıyken oynanamıyor.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
